<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- main section -->
    <main>
      <!-- calculator  -->
      <div class="container" id="container">
        <input type="text" id="display" readonly placeholder="0" />
        <div class="first-row row">
          <button id="clear" class="clear" onclick="clearDisplay()">AC</button>
          <button id="delete" class="deleteLast" onclick="deleteLast()">
            DEL
          </button>
          <button id="percent" onclick="appendOperator('%')">%</button>
          <button id="divide" onclick="appendOperator('/')">/</button>
        </div>
        <div class="second-row row">
          <button id="seven" onclick="appendNumber('7')">7</button>
          <button id="eight" onclick="appendNumber('8')">8</button>
          <button id="nine" onclick="appendNumber('9')">9</button>
          <button id="multply" onclick="appendOperator('*')">*</button>
        </div>
        <div class="third-row row">
          <button id="four" onclick="appendNumber('4')">4</button>
          <button id="five" onclick="appendNumber('5')">5</button>
          <button id="six" onclick="appendNumber('6')">6</button>
          <button id="subtract" onclick="appendOperator('-')">-</button>
        </div>
        <div class="fourth-row row">
          <button id="one" onclick="appendNumber('1')">1</button>
          <button id="two" onclick="appendNumber('2')">2</button>
          <button id="three" onclick="appendNumber('3')">3</button>
          <button id="addition" onclick="appendOperator('+')">+</button>
        </div>
        <div class="fifth-row row">
          <button id="brackets" onclick="appendOperator('()')">()</button>
          <button id="zero" onclick="appendNumber('0')">0</button>
          <button id="decimal" onclick="appendDecimal('.')">.</button>
          <button id="calculation" class="calculate" onclick="calculate()">
            =
          </button>
        </div>
      </div>
    </main>

    <!-- Javascript file -->
    <script src="script.js"></script>
    <!-- font awsome javascript kit -->
    <!-- <script
      src="https://kit.fontawesome.com/YOUR_KIT_CODE.js"
      crossorigin="anonymous"
    ></script> -->
  </body>
</html>
